          fill="none" stroke="#C96A4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Voice hint: two quiet waveform bars (saffron + sage) -->
  <g stroke-linecap="round" stroke-width="3.4">
    <path d="M15.5 51v4.5" stroke="#D6A84F"/>
    <path d="M22.5 49v8.5" stroke="#789B78"/>
    <path d="M32 47.5v11.5" stroke="#D6A84F"/>
