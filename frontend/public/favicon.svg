  <!-- MediKiosk brand mark: leaf + heartbeat midrib, terracotta on indigo -->
  <g transform="translate(11 7)">
    <path d="M21 3C13.4 8.2 9.4 14.4 9.4 21.6 9.4 27.7 13.9 32.4 21 32.4s11.6-4.7 11.6-10.8C32.6 14.4 28.6 8.2 21 3Z"
