services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medikiosk_backend
    ports:
      - "8005:8005"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - DATABASE_URL=sqlite:///./medikiosk.db
    volumes:
      - ./backend/medikiosk.db:/app/medikiosk.db
      - ./backend/uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medikiosk_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
